[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "de_duck"
version = "0.1.0"
description = "Python library for differential expression data storage and visualization using DuckDB."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["duckdb", "differential expression", "bioinformatics", "visualization", "data management"]
authors = [
  { name = "yangp7833-commits" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = [
  "duckdb>=1.0",
  "pandas>=1.0",
  "numpy>=1.20",
  "matplotlib>=3.0",
  "adjustText>=0.7"
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["de_duck*"]

[tool.setuptools.package-data]
"*" = ["*.py"]
